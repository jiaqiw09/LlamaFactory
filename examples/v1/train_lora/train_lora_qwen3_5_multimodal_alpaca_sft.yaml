# Use a real Qwen3.5 multimodal model directory here. Pure text Qwen3 models do not provide image_processor.
model: ../Qwen3.5-27B
model_class: llm
trust_remote_code: true

template: qwen3_5

# PEFT Configuration
peft_config:
  name: lora
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: all

# Kernel Config
kernel_config:
  name: auto
  include_kernels: auto

# FSDP Config
dist_config:
  name: fsdp2
  dcp_path: null

### data
train_dataset: data/v1_multimodal_alpaca_image_demo.yaml

### training
output_dir: ./outputs/test_qwen3_5_multimodal_alpaca_lora
micro_batch_size: 1
cutoff_len: 2048
learning_rate: 1.0e-4
max_steps: 10

### sample
sample_backend: hf
max_new_tokens: 128
